services:
  sublinkx:
    image: hbsx/sublinkx:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sublinkx
    ports:
      - "8000:8000"
    volumes:
      - ./data/db:/app/db
      - ./data/template:/app/template
      - ./data/logs:/app/logs
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
