services:
  sublinkx:
    image: ${SUBLINK_IMAGE:-ghcr.io/hbsx/sublinkx:latest}
    pull_policy: always
    container_name: sublinkx
    ports:
      - "${SUBLINK_PORT:-8000}:8000"
    volumes:
      - "${SUBLINK_DATA_DIR:-./data}/db:/app/db"
      - "${SUBLINK_DATA_DIR:-./data}/template:/app/template"
      - "${SUBLINK_DATA_DIR:-./data}/logs:/app/logs"
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
